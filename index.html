  FORM_HOST = pane;
  if (PUBLISHERS[id]) renderPublisher(id);
  else if (SERVICES[id]) renderService(id);
  else if (id==="gallery") renderGallery();
}

/* ---------- drop zone ---------- */
function dropZone(onFile, label){
  const z = document.createElement("div");
  z.className = "drop";
  z.innerHTML = `<b>Drop file here</b> &nbsp;/&nbsp; click to browse<br>${label||""}`;
  const inp = document.createElement("input");
  inp.type = "file"; inp.className = "hide";
  z.appendChild(inp);
  z.onclick = ()=> inp.click();
  inp.onchange = ()=> inp.files[0] && onFile(inp.files[0]);
  ["dragenter","dragover"].forEach(e=> z.addEventListener(e, ev=>{ ev.preventDefault(); z.classList.add("hot"); }));
  ["dragleave","drop"].forEach(e=> z.addEventListener(e, ev=>{ ev.preventDefault(); z.classList.remove("hot"); }));
  z.addEventListener("drop", ev=>{ const f = ev.dataTransfer.files[0]; if (f) onFile(f); });
  return z;
}

/* ---------- prompt library ---------- */
// Stored per service id in localStorage, and hung off the field spec rather than any one
// model: every model that declares a plain `prompt` textarea - including ones added later -
// gets the store, the picker and the counter with no extra wiring. A new model only needs
// its ["prompt","textarea",...] field, as it already does.
const PSEL = {};                                  // svcId -> selected prompt id, survives re-renders
const pKey = id => "prompts:" + id;
function pList(id){                               // newest first
  try { return (JSON.parse(localStorage.getItem(pKey(id))) || []).sort((a,b)=> b.id - a.id); }
  catch(e){ return []; }
}
function pWrite(id, list){ localStorage.setItem(pKey(id), JSON.stringify(list)); }
// The id is what edit and delete match on, and Date.now() repeats when two prompts are
// saved inside the same millisecond - so bump past anything already taken.
// `neg` (the negative prompt) rides along for models that have one; it is left off entirely for
// models that do not, and older saved prompts simply have no `neg` key - both read back as absent.
function pAdd(id, title, body, neg){
  const list = pList(id);
  let pid = Date.now();
  while (list.some(p => p.id === pid)) pid++;
  list.unshift(neg === undefined ? { id: pid, title, body } : { id: pid, title, body, neg });
  pWrite(id, list);
  return pid;
}
function pSet(id, pid, title, body, neg){
  const rec = (p) => neg === undefined ? { id: p.id, title, body } : { id: p.id, title, body, neg };
  pWrite(id, pList(id).map(p => p.id === pid ? rec(p) : p));
}
function pDel(id, pid){ pWrite(id, pList(id).filter(p => p.id !== pid)); }

// `apply` writes the loaded text back into form state and refreshes the counter.
// `fresh` is true only on a first open of the tab, which is when the top (most recent)
// prompt is selected and loaded; a re-render keeps whatever was selected.
function promptBar(svcId, ta, apply, fresh, ctx){
  // ctx.negKey is the model's negative-prompt field (if it has one), so a saved profile carries
  // the positive and negative prompt together. negNow() is undefined for models with no negative
  // field, which keeps `neg` off their saved records entirely.
  const negKey = ctx && ctx.negKey;
  const negNow = () => negKey ? (ctx.state[negKey] ?? "") : undefined;
  const loadNeg = (p) => { if (negKey && "neg" in p){ ctx.state[negKey] = p.neg || ""; ctx.redraw(); } };
  const bar = document.createElement("div");
  bar.className = "pbar";
  const sel = document.createElement("select");
  bar.appendChild(sel);
  const btn = (cls, text, fn)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = text; b.onclick = fn;
    bar.appendChild(b); return b;
  };
  const current = ()=> pList(svcId).find(p => p.id === Number(sel.value));

  const fill = ()=>{
    const list = pList(svcId);
    sel.innerHTML = list.length
      ? list.map(p=> `<option value="${p.id}">${esc(p.title)}</option>`).join("")
      : `<option value="">- no saved prompts -</option>`;
    if (list.length){
      if (!list.some(p => p.id === PSEL[svcId])) PSEL[svcId] = list[0].id;
      sel.value = PSEL[svcId];
    } else delete PSEL[svcId];
    [edit, load, del].forEach(b => b.disabled = !list.length);
  };
  sel.onchange = ()=> PSEL[svcId] = Number(sel.value);

  const add = btn("p-new", "New", ()=>{
    const title = (window.prompt("Title for this prompt") || "").trim();
    if (!title) return;
    PSEL[svcId] = pAdd(svcId, title, ta.value, negNow());
    fill();
    local("sys", `prompt "${title}" saved for ${svcId}`);
  });
  const edit = btn("p-edit", "Edit", ()=>{
    const p = current(); if (!p) return;
    const title = (window.prompt("Title for this prompt", p.title) || "").trim();
    if (!title) return;
    pSet(svcId, p.id, title, ta.value, negNow());   // body + negative come from the form, so Edit saves both
    fill();
    local("sys", `prompt "${title}" updated for ${svcId}`);
  });
  const load = btn("p-load", "Load", ()=>{
    const p = current(); if (!p) return;
    ta.value = p.body; apply(p.body);
    loadNeg(p);   // restores the negative field too (and re-renders) when the profile carries one
  });
  const del = btn("p-del", "Delete", ()=>{
    const p = current(); if (!p) return;
    if (!confirm(`Delete prompt "${p.title}"?`)) return;
    pDel(svcId, p.id); delete PSEL[svcId]; fill();
    local("sys", `prompt "${p.title}" deleted from ${svcId}`);
  });

  fill();
  if (fresh){
    const list = pList(svcId);
    if (list.length){ PSEL[svcId] = list[0].id; sel.value = list[0].id;
                      ta.value = list[0].body; apply(list[0].body);
                      // the negative field renders later in this same pass, so seeding state is enough
                      if (negKey && "neg" in list[0]) ctx.state[negKey] = list[0].neg || ""; }
  }
  return bar;
}

/* ---------- service form ---------- */
// Number("") is 0, and on an optional field (bria's seed, its placement pairs) 0 is a
// real value that means something else - so a blank stays blank the whole way through,
// and the send loop drops it. Every default-seeding path has to agree on this.
const numOrBlank = (type, v) => type === "number" && v !== "" ? Number(v) : v;

// A tab's form state and its results panel outlive leaving the tab: a job keeps polling
// and saving while you set up the next one, and coming back has to show it rather than a
// blank form. FORMS holds the inputs, OUTS the result cards, STATUS the live status line -
// all keyed by service id, all reattached on render.
const FORMS = {}, OUTS = {}, STATUS = {};

function renderService(id, state){
  const svc = SERVICES[id];
  state = state || FORMS[id];
  const fresh = !state;              // first open of this tab, not a re-render
  // Seed defaults once, then keep the same object across re-renders so switching
  // model_version does not wipe the uploaded image URL.
  if (!state){
    state = {};
    svc.fields.forEach(([n,t,l,o])=>{ if (o.def!==undefined) state[n] = numOrBlank(t, o.def); });
  }
  FORMS[id] = state;
  FORM_HOST.innerHTML = "";
  const h = document.createElement("div");
  h.className = "category"; h.textContent = svc.title;
  FORM_HOST.appendChild(h);

  // Seed defaults for whatever just became visible, twice: fix_lighting_mode's gate
  // reads enhancement_strength, which only gets its default on the pass before.
  const seed = ()=> svc.fields.forEach(([n,t,l,o])=>{
    if (o.when && !o.when(state)) return;
    if (state[n] === undefined && o.def !== undefined) state[n] = numOrBlank(t, o.def);
  });
  seed(); seed();

  // A hidden field must not be sent: v4 with output_resolution left over from v3
  // is a different request than the form is showing.
  const shown = svc.fields.filter(([n,t,l,o])=> !o.when || o.when(state));
  const keep = new Set(shown.map(f=>f[0]));
  const areasOn = typeof svc.areas === "function" ? svc.areas(state) : !!svc.areas;
  Object.keys(state).forEach(k=>{
    if (!keep.has(k) && !(areasOn && k in AREAS)) delete state[k];
  });

  const grid = document.createElement("div"); grid.className = "grid";
  shown.forEach(([name, type, label, spec])=>{
    const o = Object.assign({}, spec, spec.by ? spec.by(state) : {});
    if (spec.optsBy) o.opts = spec.optsBy(state);
    const redraw = ()=> renderService(id, state);
    const row = document.createElement("div");
    row.className = "row" + (["textarea","json","file","files","sizepick"].includes(type) ? " full" : "");
    row.innerHTML = `<div class="lbl">${label}${o.hint?`<small>${o.hint}</small>`:""}</div>`;
    const cell = document.createElement("div");

    if (type === "file"){
      const url = document.createElement("input");
      url.type = "text"; url.placeholder = "https://... or drop a file below";
      url.value = state[name] || "";
      // A service may declare fit(state,w,h) - bria expand sizes its placement fields
      // off the measured source image as it lands (drop or paste).
      const fitIm = src => { if (svc.fit){
        const im = new Image(); im.onload = () => { svc.fit(state, im.naturalWidth, im.naturalHeight); redraw(); };
        im.src = src; } };
      url.oninput = ()=> { state[name] = url.value; fitIm(url.value); };
      // rerender on a file field redraws once the value has settled (blur / enter, or the
      // upload landing), not per keystroke - a redraw replaces the box being typed into.
      url.onchange = ()=> { if (o.rerender) redraw(); };
      cell.appendChild(url);
      const z = dropZone(async f=>{
        z.innerHTML = "uploading...";
        const r = await uploadFile(f);
        if (r){ url.value = r.url; state[name] = r.url;
          z.innerHTML = `<b>${f.name}</b><br>${r.url}`;
          if (f.type.startsWith("image/")){ const im=document.createElement("img"); im.src=r.local; im.style.maxHeight="120px"; im.style.marginTop="8px"; z.appendChild(im); fitIm(r.local); }
          if (o.rerender) redraw();
        } else z.innerHTML = "<b>upload failed</b>";
      }, name);
      z.style.marginTop = "6px";
      cell.appendChild(z);
    } else if (type === "files"){
      // One URL per line, and the drop zone appends rather than replaces - these fields
      // take up to 9 references and dropping the second file must not lose the first.
      const ta = document.createElement("textarea");
      ta.rows = 3; ta.placeholder = "https://... one URL per line";
      ta.value = (state[name] || []).join("\n");
      const sync = ()=> state[name] = ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
      ta.oninput = sync;
      cell.appendChild(ta);
      const z = dropZone(async f=>{
        z.innerHTML = "uploading...";
        const r = await uploadFile(f);
        if (r){ ta.value = (ta.value.trim() ? ta.value.trim()+"\n" : "") + r.url; sync();
          z.innerHTML = `<b>added ${f.name}</b><br>${state[name].length} file(s)`; }
        else z.innerHTML = "<b>upload failed</b>";
      }, name);
      z.style.marginTop = "6px";
      cell.appendChild(z);
    } else if (type === "select"){
      const s = document.createElement("select");
      const cast = v => o.num ? Number(v) : v;
      o.opts.forEach(v=>{ const op=document.createElement("option"); op.value=op.textContent=v; s.appendChild(op); });
      // The stored value may be illegal for the version just picked (v3 + "heavy").
      if (!o.opts.map(String).includes(String(state[name]))) state[name] = cast(o.def);
      s.value = state[name];
      s.onchange = ()=>{ state[name] = cast(s.value); if (o.rerender) redraw(); };
      cell.appendChild(s);
    } else if (type === "sizepick"){
      // Two rows of chips, ratio then pixels. Only `size` is ever stored - the ratio is
      // read back off the chosen value, so no extra key leaks into the request body.
      const groups = o.opts, ratios = Object.keys(groups);
      const ratioOf = v => ratios.find(r => groups[r].includes(v));
      if (!ratioOf(state[name])) state[name] = o.def;
      const box = document.createElement("div"); box.className = "pick";
      const rrow = document.createElement("div"); rrow.className = "pick-row";
      const srow = document.createElement("div"); srow.className = "pick-row";
      box.append(rrow, srow); cell.appendChild(box);
      const chip = (on, html, fn)=>{
        const b = document.createElement("div");
        b.className = "chip" + (on ? " on" : ""); b.innerHTML = html; b.onclick = fn; return b;
      };
      const mp = v => (v.split("x").reduce((a,b)=> a*b, 1) / 1e6).toFixed(1) + " MP";
      const paint = ()=>{
        const cur = state[name], r = ratioOf(cur), tier = groups[r].indexOf(cur);
        rrow.innerHTML = ""; srow.innerHTML = "";
        ratios.forEach(k=>{
          const [w,h] = k.split(":").map(Number), u = 17 / Math.max(w,h);
          rrow.appendChild(chip(k === r,
            `<i style="width:${(w*u).toFixed(1)}px;height:${(h*u).toFixed(1)}px"></i>${k}`,
            // same tier on the new shape, so switching 4:3 -> 16:9 does not drop 4 MP to 1
            ()=>{ state[name] = groups[k][tier]; paint(); }));
        });
        groups[r].forEach(v => srow.appendChild(
          chip(v === cur, `<b>${v}</b><s>${mp(v)}</s>`, ()=>{ state[name] = v; paint(); })));
      };
      paint();
    } else if (type === "bool"){
      const c = document.createElement("input");
      if (state[name] === undefined) state[name] = !!o.def;
      c.type = "checkbox"; c.checked = !!state[name];
      c.onchange = ()=>{ state[name] = c.checked; if (o.rerender) redraw(); };
      cell.appendChild(c);
    } else if (type === "textarea" || type === "json"){   // json is parsed at send time
      const t = document.createElement("textarea");
      t.rows = o.rows||4; t.value = state[name] ?? o.def ?? "";
      t.oninput = ()=> state[name] = t.value;
      // The prompt box, and only that, carries the library and the character count.
      // Titles are never sent anywhere, so they are not counted.
      if (name === "prompt"){
        const cnt = document.createElement("span"); cnt.className = "pcount";
        row.querySelector(".lbl").appendChild(cnt);
        const apply = v => { state[name] = v; cnt.textContent = v.length + " characters"; };
        t.oninput = ()=> apply(t.value);
        // Save the negative prompt in the same profile for any model that has one.
        const negKey = (svc.fields.find(f => f[0] === "negativePrompt" || f[0] === "negative_prompt") || [])[0];
        cell.appendChild(promptBar(id, t, apply, fresh, { state, negKey, redraw }));
        apply(t.value);
      }
      cell.appendChild(t);
    } else {
      const i = document.createElement("input");
      i.type = type;
      if (o.min!==undefined) i.min=o.min; if (o.max!==undefined) i.max=o.max;
      if (o.step!==undefined) i.step=o.step;
      // by() can move the range (realism is 0-5 on v1, 0-3 on v3) - clamp the carried value.
      if (state[name] === undefined && o.def !== undefined) state[name] = numOrBlank(type, o.def);
      if (type==="number" && state[name] !== "" && o.max!==undefined && Number(state[name]) > o.max)
        state[name] = numOrBlank(type, o.def);
      if (state[name] !== undefined) i.value = state[name];
      i.oninput = ()=> state[name] = numOrBlank(type, i.value);
      cell.appendChild(i);
    }
    // The visible label is a sibling <div>, never associated with the control, so give each
    // control the label as its accessible name - otherwise a screen reader announces a bare
    // combobox / checkbox / edit-text. One pass covers every field type and every tab.
    const aname = String(label).replace(/<[^>]*>/g, "").trim();
    cell.querySelectorAll("input,select,textarea").forEach(el=>{
      if (!el.getAttribute("aria-label")) el.setAttribute("aria-label", aname);
    });
    row.appendChild(cell);
    grid.appendChild(row);
  });
  FORM_HOST.appendChild(grid);

  if (areasOn){
    const t = document.createElement("div"); t.className="category"; t.textContent="Keep unchanged";
    FORM_HOST.appendChild(t);
    const box = document.createElement("div"); box.className="toggles";
    Object.entries(AREAS).forEach(([k,v])=>{
      if (state[k] === undefined) state[k] = v;
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" ${state[k]?"checked":""}> ${k}`;
      l.querySelector("input").onchange = e => state[k] = e.target.checked;
      box.appendChild(l);
    });
    FORM_HOST.appendChild(box);
  }

  const acts = document.createElement("div"); acts.className = "actions";
  const send = document.createElement("button"); send.textContent = "Queue request";
  // Puts the tab back exactly as it first opened: uploads gone, every field at its default,
  // and the prompt box reloaded from the library the way a first open does.
  const clear = document.createElement("button");
  clear.className = "ghost"; clear.textContent = "Clear inputs";
  clear.onclick = ()=>{ delete FORMS[id]; renderService(id); };
  const status = STATUS[id] || (STATUS[id] = document.createElement("span"));
  status.className = status.className || "note";
  status.setAttribute("aria-live", "polite");   // announce queue/poll/done progress to screen readers
  acts.append(send, clear, status);
  FORM_HOST.appendChild(acts);
  // Same node every render, so a tracker that is mid-poll keeps writing into the panel
  // the tab shows when you come back to it.
  const out = OUTS[id] || (OUTS[id] = document.createElement("div"));
  FORM_HOST.appendChild(out);

  send.onclick = async ()=>{
    const body = {};
    const types = Object.fromEntries(svc.fields.map(f=>[f[0], f[1]]));
    for (const [k, v] of Object.entries(state)){
      if (v === "" || v === undefined) continue;
      if (Array.isArray(v) && !v.length) continue;
      if (types[k] === "json"){
        try { body[k] = JSON.parse(v); }
        catch(e){ local("err", `${k} is not valid JSON: ${e.message}`); return; }
        continue;
      }
      body[k] = v;
    }
    send.disabled = true;
    status.className = "note";        // clear a "bad" left over from the last run
    // prep() runs before shape(): it pulls any uploaded image/video inputs back as base64,
    // which shape() then folds into the request body (Gemini takes no http image URL).
    if (svc.prep){
      status.textContent = "preparing inputs...";
      try { await svc.prep(body); }
      catch(e){ status.className = "note bad"; status.textContent = "input prep failed";
                local("err", "prep failed: " + e.message); send.disabled = false; return; }
    }
    if (svc.shape) svc.shape(body);
    status.textContent = "queuing...";
    // fal queues at the endpoint id itself and polls; Enhancor queues at /queue and webhooks;
    // BytePlus takes the model in the body, so one endpoint serves every model it hosts.
    const ark = svc.ark || svc.arkImage;
    // Kling puts the model in the path, and motion control is a different path on the same
    // model - so the endpoint is a function of the form state, not a constant.
    const kl = svc.kling && (typeof svc.kling === "function" ? svc.kling(state) : svc.kling);
    // QwenCloud is ModelArk-shaped - model in the body, one endpoint per kind - except that
    // the video route only queues when asked to by header; without it the call blocks.
    // Paths are relative like Kling's, so the page prefixes the host here.
    const qw = (svc.qwen || svc.qwenImage) && QWEN + (svc.qwen || svc.qwenImage);
    // Gemini: Veo takes the model in the path (:predictLongRunning); Omni takes it in the body,
    // like ModelArk. Both auth with x-goog-api-key, which the proxy sets by host.
    const veoUrl = svc.veo && `${GEMINI}/models/${svc.veo}:predictLongRunning`;
    const omniUrl = svc.omni && GEMINI + svc.omni;
    const r = svc.fal
      ? await callApi(`https://queue.fal.run/${svc.fal}`, body, { autoWebhook:false })
      : svc.bria
      ? await callApi(`${BRIA}/${svc.bria}`, body, { autoWebhook:false })
      : svc.briav1
      ? await callApi(`${BRIA_V1}/${svc.briav1}`, body, { autoWebhook:false })
      : veoUrl
      ? await callApi(veoUrl, body, { autoWebhook:false })
      : omniUrl
      ? await callApi(omniUrl, Object.assign({ model: svc.model }, body), { autoWebhook:false })
      : kl
      ? await callApi(KLING + kl, body, { autoWebhook:false })
      : ark
      ? await callApi(ark, Object.assign({ model: svc.model }, body), { autoWebhook:false })
      : qw
      ? await callApi(qw, Object.assign({ model: svc.model }, body),
                      { autoWebhook:false, headers: svc.qwen ? { "X-DashScope-Async": "enable" } : undefined })
      : await callApi(`${svc.base}/queue`, body);
    send.disabled = false;
    if (!r.ok){ status.textContent = `failed (${r.status})`; status.className="note bad"; return; }
    const j = r.json || {};
    const abbr = outAbbr(svc, state);
    const input = inputName(svc, state);
    // Veo hands back a long-running operation name to poll; Omni is synchronous and the one
    // response already carries (a pointer to) the finished clip.
    if (svc.veo){
      const op = j.name || "";
      if (!op){ status.className = "note bad"; status.textContent = "no operation in response";
                local("err", `veo: no operation name: ${(r.text||"").slice(0,300)}`); return; }
      status.textContent = `${op.split("/").pop()} queued`;
      trackVeo(op, status, out, abbr, input); return;
    }
    if (svc.omni){ status.textContent = "generating..."; trackOmni(j, status, out, abbr, input); return; }
    // Synchronous image paths: ModelArk, QwenCloud, and Bria's v1 automotive routes all
    // carry the result in this one response (Bria v1 at top-level url, via results()).
    if (svc.arkImage || svc.qwenImage || svc.briav1){
      const urls = svc.results(j);
      const who = svc.model || svc.briav1;
      if (!urls.length){
        status.className = "note bad"; status.textContent = "no image in the response";
        local("err", `${who} returned no image: ${(r.text||"").slice(0,300)}`); return;
      }
      status.className = "note"; status.textContent = `DONE (${urls.length})`;
      urls.forEach(u => showResult(out, u, who, abbr, input));
      return;
    }
    // Kling's and QwenCloud's top-level request_id names the HTTP call, not the job - the
    // task id is nested: Kling's under data, QwenCloud's under output.
    const rid = svc.kling ? (j.data || {}).id
              : svc.qwen  ? (j.output || {}).task_id
              : (j.requestId || j.request_id || j.id);
    status.className = "note"; status.textContent = `request ${rid||"?"} queued`;
    if (!rid) return;
    if (svc.fal) trackFal(svc, j, status, out, abbr, input);
    else if (svc.bria) trackBria(svc, j, status, out, abbr, input);
    else if (svc.kling) trackKling(rid, status, out, abbr, input);
    else if (svc.qwen) trackQwen(rid, status, out, abbr, input);
    else if (svc.ark) trackArk(svc, rid, status, out, abbr, input);
    else trackRequest(svc.base, rid, r.webhookToken, status, out, abbr, input);
  };
}

/* ---------- output naming ---------- */
// The server appends the destination folder, so this is only the model half.
function outAbbr(svc, state){
  return typeof svc.abbr === "function" ? svc.abbr(state) : (svc.abbr || "out");
}
// The first-frame input's original filename, recovered from its uploaded URL
// (uploads are stored as <8hex>_<name>), used to name the output after its input.
// First singular file field that isn't a trailing-frame/mask input wins; "" when
// there's no image input (text-to-video), so naming falls back to <abbr>_<folder>.
function inputName(svc, state){
  const f = (svc.fields || []).find(([n, t]) =>
    t === "file" && !/last|end|tail|mask/i.test(n) && state[n]);
  if (!f) return "";
  const base = decodeURIComponent((state[f[0]].split("?")[0].split("/").pop()) || "");
  return base.replace(/\.[^.]+$/, "").replace(/^[0-9a-f]{8}_/i, "");
}

/* ---------- polling ---------- */
async function trackRequest(base, requestId, token, statusEl, outEl, abbr, input){
  for (let i=0; i<150; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const r = await callApi(`${base}/status`, { request_id: requestId }, { autoWebhook:false });
    const j = r.json || {};
    statusEl.textContent = `${requestId} :: ${j.status || r.status} ${j.cost!==undefined?`(cost ${j.cost})`:""}`;
    const hook = token ? (await (await fetch("/api/results")).json()).results[token] : null;
    const url = hook?.result || j.result || j.output || j.url;
    if (url){
      reportFal({ text: JSON.stringify(hook||j) + " " + url, headers: r.headers }, requestId);
      statusEl.textContent = `${requestId} :: DONE`; showResult(outEl, url, requestId, abbr, input); return;
    }
    if (["FAILED","ERROR"].includes(j.status)){ statusEl.className="note bad"; return; }
    if (j.status === "COMPLETED" && !url && i>2){
      local("warn", `${requestId} COMPLETED but no result URL in /status - waiting on webhook`);
    }
  }
  statusEl.textContent = `${requestId} :: timed out polling`;
}

/* ---------- fal polling ---------- */
// No webhook on this path: submit hands back status_url and response_url, both GETs.
// Using the URLs fal returns rather than building them - for a nested endpoint id
// (bytedance/seedream/v5/pro/edit) the request path is not the endpoint id.
async function trackFal(svc, sub, statusEl, outEl, abbr, input){
  const get = url => callApi(url, null, { method:"GET", autoWebhook:false });
  for (let i=0; i<150; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const s = await get(sub.status_url);
    if (s.status >= 400 || s.status === 0){
      statusEl.className = "note bad";
      statusEl.textContent = `${sub.request_id} :: polling failed (${s.status})`;
      return;
    }
    const j = s.json || {};
    statusEl.textContent = `${sub.request_id} :: ${j.status || s.status}` +
      (j.queue_position !== undefined && j.queue_position !== null ? ` (queue ${j.queue_position})` : "");
    if (j.status !== "COMPLETED") continue;

    const r = await get(sub.response_url);
    const urls = svc.results(r.json || {});
    if (!urls.length){
      statusEl.className = "note bad";
      statusEl.textContent = `${sub.request_id} :: completed with no image URL`;
      local("err", `${sub.request_id} completed but the response carried no image: ${(r.text||"").slice(0,300)}`);
      return;
    }
    statusEl.textContent = `${sub.request_id} :: DONE (${urls.length})`;
    urls.forEach(u => showResult(outEl, u, sub.request_id, abbr, input));
    return;
  }
  statusEl.textContent = `${sub.request_id} :: timed out polling`;
}

/* ---------- bria polling ---------- */
// Submit returns {request_id, status_url}; the status GET (api_token added by the proxy)
// carries result.image_url inline on COMPLETED - no separate response fetch, unlike fal.
// Every route is async; some also accept sync, but one async path keeps them uniform.
async function trackBria(svc, sub, statusEl, outEl, abbr, input){
  const id = sub.request_id || "?";
  for (let i=0; i<150; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const s = await callApi(sub.status_url, null, { method:"GET", autoWebhook:false });
    if (s.status >= 400 || s.status === 0){
      statusEl.className = "note bad"; statusEl.textContent = `${id} :: polling failed (${s.status})`; return;
    }
    const j = s.json || {};
    statusEl.textContent = `${id} :: ${j.status || s.status}`;
    if (["ERROR","FAILED"].includes(j.status)){
      statusEl.className = "note bad";
      local("err", `${id} ${j.status}: ${(s.text||"").slice(0,300)}`); return;
    }
    if (j.status !== "COMPLETED") continue;
    const urls = svc.results(j);
    if (!urls.length){
      statusEl.className = "note bad"; statusEl.textContent = `${id} :: completed with no image URL`;
      local("err", `${id} completed but carried no image: ${(s.text||"").slice(0,300)}`); return;
    }
    statusEl.textContent = `${id} :: DONE (${urls.length})`;
    urls.forEach(u => showResult(outEl, u, id, abbr, input));
    return;
  }
  statusEl.textContent = `${id} :: timed out polling`;
}

/* ---------- BytePlus polling ---------- */
// One GET per tick until the task is terminal. Result URLs are signed and expire, which is
// why showResult saves on sight rather than waiting for a click.
async function trackArk(svc, id, statusEl, outEl, abbr, input){
  for (let i=0; i<300; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const r = await callApi(`${ARK}/contents/generations/tasks/${id}`, null,
                            { method:"GET", autoWebhook:false });
    if (r.status >= 400 || r.status === 0){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: polling failed (${r.status})`;
      return;
    }
    const j = r.json || {};
    statusEl.textContent = `${id} :: ${j.status || r.status}` +
      (j.usage && j.usage.completion_tokens ? ` (${j.usage.completion_tokens} tokens)` : "");
    if (["failed","cancelled","expired"].includes(j.status)){
      statusEl.className = "note bad";
      local("err", `${id} ${j.status}: ${(j.error && j.error.message) || (r.text||"").slice(0,300)}`);
      return;
    }
    if (j.status !== "succeeded") continue;
    const urls = svc.results(j);
    if (!urls.length){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: succeeded with no video URL`;
      local("err", `${id} succeeded but the task carried no video: ${(r.text||"").slice(0,300)}`);
      return;
    }
    statusEl.textContent = `${id} :: DONE`;
    urls.forEach(u => showResult(outEl, u, id, abbr, input));
    // Only present when the form asked for it - the chaining frame for the next clip.
    if (j.content && j.content.last_frame_url)
      showResult(outEl, j.content.last_frame_url, id + "-last", abbr, input);
    return;
  }
  statusEl.textContent = `${id} :: timed out polling`;
}

/* ---------- Kling polling ---------- */
// One GET covers every Kling model. 4k and 15s jobs run long, hence the longer ceiling
// than fal's - 450 ticks is half an hour.
async function trackKling(id, statusEl, outEl, abbr, input){
  for (let i=0; i<450; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const r = await callApi(`${KLING}/tasks?task_ids=${encodeURIComponent(id)}`, null,
                            { method:"GET", autoWebhook:false });
    if (r.status >= 400 || r.status === 0){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: polling failed (${r.status})`;
      return;
    }
    const t = (((r.json || {}).data) || [])[0] || {};
    const units = (t.billing || []).map(b => b.amount).filter(Boolean).join(" + ");
    statusEl.textContent = `${id} :: ${t.status || r.status}` + (units ? ` (${units} units)` : "");
    if (t.status === "failed"){
      statusEl.className = "note bad";
      local("err", `${id} failed: ${t.message || (r.text||"").slice(0,300)}`);
      return;
    }
    if (t.status !== "succeeded") continue;
    const urls = (t.outputs || []).map(o => o.url).filter(Boolean);
    if (!urls.length){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: succeeded with no video URL`;
      local("err", `${id} succeeded but the task carried no output: ${(r.text||"").slice(0,300)}`);
      return;
    }
    statusEl.textContent = `${id} :: DONE (${urls.length})`;
    urls.forEach(u => showResult(outEl, u, id, abbr, input));
    return;
  }
  statusEl.textContent = `${id} :: timed out polling`;
}

/* ---------- QwenCloud polling ---------- */
// GET /tasks/{id} until task_status is terminal. Their sample 1080p run took twelve minutes
// end to end and 30s clips run longer, so the ceiling matches Kling's half hour.
async function trackQwen(id, statusEl, outEl, abbr, input){
  for (let i=0; i<450; i++){
    await new Promise(r=> setTimeout(r, 4000));
    const r = await callApi(`${QWEN}/tasks/${encodeURIComponent(id)}`, null,
                            { method:"GET", autoWebhook:false });
    if (r.status >= 400 || r.status === 0){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: polling failed (${r.status})`;
      return;
    }
    const o = (r.json || {}).output || {};
    statusEl.textContent = `${id} :: ${o.task_status || r.status}`;
    if (["FAILED","CANCELED","UNKNOWN"].includes(o.task_status)){
      statusEl.className = "note bad";
      local("err", `${id} ${o.task_status}: ${o.message || o.code || (r.text||"").slice(0,300)}`);
      return;
    }
    if (o.task_status !== "SUCCEEDED") continue;
    if (!o.video_url){
      statusEl.className = "note bad";
      statusEl.textContent = `${id} :: succeeded with no video URL`;
      local("err", `${id} succeeded but the task carried no video: ${(r.text||"").slice(0,300)}`);
      return;
    }
    statusEl.textContent = `${id} :: DONE`;
    showResult(outEl, o.video_url, id, abbr, input);
    return;
  }
  statusEl.textContent = `${id} :: timed out polling`;
}

/* ---------- Veo polling ---------- */
// GET the operation until done. Generation runs 11s to ~6 min, so the ceiling is generous.
// The result uri is key-gated: preview through /api/blob, which the proxy auths by host.
async function trackVeo(opName, statusEl, outEl, abbr, input){
  const short = opName.split("/").pop();
  for (let i=0; i<300; i++){
    await new Promise(r=> setTimeout(r, 8000));
    const r = await callApi(`${GEMINI}/${opName}`, null, { method:"GET", autoWebhook:false });
    if (r.status >= 400 || r.status === 0){
      statusEl.className = "note bad";
      statusEl.textContent = `${short} :: polling failed (${r.status})`; return;
    }
    const j = r.json || {};
    statusEl.textContent = `${short} :: ${j.done ? "done" : "running"}`;
    if (!j.done) continue;
    if (j.error){
      statusEl.className = "note bad"; statusEl.textContent = `${short} :: FAILED`;
      local("err", `${short} failed: ${JSON.stringify(j.error).slice(0,400)}`); return;
    }
    const samples = (((j.response || {}).generateVideoResponse || {}).generatedSamples) || [];
    const uris = (Array.isArray(samples) ? samples : []).map(s => (s && s.video || {}).uri).filter(Boolean);
    if (!uris.length){
      statusEl.className = "note bad"; statusEl.textContent = `${short} :: done, no video uri`;
      local("err", `${short} done but no uri: ${(r.text||"").slice(0,400)}`); return;
    }
    statusEl.textContent = `${short} :: DONE (${uris.length})`;
    uris.forEach(u => showResult(outEl, u, short, abbr, input,
      { video:true, previewUrl: blobUrl(u) }));
    return;
  }
  statusEl.textContent = `${short} :: timed out polling`;
}

/* ---------- Omni polling ---------- */
// Interactions is synchronous, so `interaction` is already the finished turn. With
// delivery:uri it points at a Files-API object we poll to ACTIVE, then download (key-gated).
// If only inline base64 came back, surface it as a data: URL (preview only).
// Search only the model_output steps: the interaction echoes the prompt and other input in
// user_input steps, and a files/... id mentioned there must not be mistaken for the result.
function omniOutputSteps(j){
  const steps = (j && Array.isArray(j.steps)) ? j.steps : [];
  const outs = steps.filter(s => s && s.type === "model_output");
  return outs.length ? outs : steps;   // fall back to all steps if the type field is absent
}
function omniFindFile(scope){
  let found = null;
  (function walk(v){
    if (found) return;
    if (typeof v === "string"){ const m = v.match(/files\/[A-Za-z0-9_-]+/); if (m) found = m[0]; }
    else if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === "object") Object.values(v).forEach(walk);
  })(scope);
  return found;
}
async function trackOmni(interaction, statusEl, outEl, abbr, input){
  // The interaction id (not the file id) is what edit/extend needs as previous_interaction_id,
  // so surface it - in the console and on the result card - or the chaining field is unusable.
  const iid = interaction && interaction.id;
  if (iid) local("sys", `omni interaction id: ${iid}${interaction.store === false ? " (not stored - can't be edited)" : ""}`);
  const fileId = omniFindFile(omniOutputSteps(interaction));
  if (!fileId){
    statusEl.className = "note bad"; statusEl.textContent = "no video file in response";
    local("err", `omni: no file in model output: ${JSON.stringify(interaction).slice(0,500)}`); return;
  }
  const short = fileId.split("/").pop();
  const label = iid ? `${short} · ${iid}` : short;
  for (let i=0; i<150; i++){
    const r = await callApi(`${GEMINI}/${fileId}`, null, { method:"GET", autoWebhook:false });
    if (r.status >= 400 || r.status === 0){
      statusEl.className = "note bad"; statusEl.textContent = `${short} :: poll failed (${r.status})`; return;
    }
    const f = r.json || {};
    statusEl.textContent = `${short} :: ${f.state || r.status}`;
    if (f.state === "FAILED"){ statusEl.className = "note bad"; local("err", `omni file ${short} FAILED`); return; }
    if (f.state === "ACTIVE"){
      const dl = `${GEMINI}/${fileId}:download?alt=media`;
      statusEl.textContent = `${short} :: DONE`;
      showResult(outEl, dl, label, abbr, input, { video:true, previewUrl: blobUrl(dl) });
      return;
    }
    await new Promise(r=> setTimeout(r, 4000));
  }
  statusEl.textContent = `${short} :: timed out polling`;
}

function showResult(el, url, id, abbr, input, opts={}){
  const isVid = opts.video || /\.(mp4|webm|mov)(\?|$)/i.test(url);
  const preview = opts.previewUrl || url;    // key-gated downloads preview through /api/blob
  const c = document.createElement("div"); c.className="card"; c.style.marginTop="12px"; c.style.maxWidth="420px";
  // esc() the preview src and build the meta via textContent: id/url can come straight from a
  // provider's JSON (Gemini operation/file ids, result URIs), so never put them in innerHTML raw.
  const label = esc(String(id));
  c.innerHTML = isVid
    ? `<video src="${esc(preview)}" controls aria-label="${label} video"></video>`
    : `<img src="${esc(preview)}" alt="${label} result">`;
  const meta = document.createElement("div"); meta.className = "meta";
  const idb = document.createElement("b"); idb.textContent = id;
  meta.append(idb, document.createTextNode(" " + url));
  c.appendChild(meta);
  const b = document.createElement("button"); b.className="ghost"; b.style.margin="0 9px 9px";
  const save = async ()=>{
    b.disabled = true; b.textContent = "Saving...";
    if (srcDir && !postGen(isVid).length){
      try { b.title = await srcSave(url, abbr, isVid, input); b.textContent = "Saved"; }
      catch(e){ b.textContent = "Retry save"; local("err", "save failed: " + e.message); }
      b.disabled = false;
      return;
    }
    const r = await post("/api/save", { url, dir: outDir(), abbr, input, scripts: postGen(isVid), chain: pgChain(isVid) });
    b.disabled = false;
    if (r.path){ b.textContent = "Saved"; b.title = r.path; }
    else { b.textContent = "Retry save"; local("err", "save failed: " + (r.error||"?")); }
  };
  b.onclick = save;
  c.appendChild(b);
  el.prepend(c);
  // Results are on their CDN, not ours - grab it the moment it lands rather than
  // waiting for a click that might come after the URL has expired.
  save();
}

/* Enhancor is understood to resell fal.ai. A passthrough leaks provenance in result URLs,
   response headers and error shapes - that is stronger evidence than any model label. */
const FAL_MARKERS = [
  [/\bv?\d*\.?fal\.media\b/i, "result hosted on fal.media CDN"],
  [/\bfal\.run\b|\bqueue\.fal\.run\b/i, "fal.run endpoint referenced"],
  [/\bfal[-_]ai\b|\bfal\.ai\b/i, "fal.ai named in payload"],
  [/"detail"\s*:\s*\[\s*{[^}]*"loc"/i, "FastAPI/pydantic error shape - fal's validation format"],
  [/\bx-fal-[a-z-]+/i, "x-fal-* response header"],
];
function falFingerprint(res){
  const hay = (res.text || "") + " " + JSON.stringify(res.headers || {});
  return FAL_MARKERS.filter(([re])=> re.test(hay)).map(([,label])=> label);
}
function reportFal(res, context){
  const hits = falFingerprint(res);
  if (hits.length) local("hook", `FAL.AI PROVENANCE (${context}): ${hits.join("; ")}`);
  return hits;
}

/* ---------- gallery ---------- */
async function renderGallery(){
  pane.innerHTML = `<div class="category">Results</div><div class="cards" id="g-cards"></div>
    <div class="category" style="margin-top:16px">Request history</div>
    <table><thead><tr><th>Time (AEST)</th><th>Endpoint</th><th>Status</th><th>Request ID</th></tr></thead><tbody id="g-h"></tbody></table>`;
  const d = await (await fetch("/api/results")).json();
  const cards = document.getElementById("g-cards");
  const entries = Object.entries(d.results);
  if (!entries.length) cards.innerHTML = `<p class="note">No webhook results yet.</p>`;
  entries.reverse().forEach(([tok, res])=>{
    const url = res.result || res.output || res.url;
    if (!url) return;
    const isVid = /\.(mp4|webm|mov)(\?|$)/i.test(url);
    const c = document.createElement("div"); c.className="card";
    c.innerHTML = `${isVid?`<video src="${url}" controls></video>`:`<img src="${url}">`}
      <div class="meta"><b>${res.request_id||tok}</b>${res.status||""}<br>${url}</div>`;
    const b = document.createElement("button"); b.className="ghost"; b.textContent="Save"; b.style.margin="0 9px 9px";
    // No form state here, so no input filename to name it after - folder only.
    b.onclick = async ()=>{
      if (srcDir && !postGen(isVid).length){
        try { await srcSave(url, null); b.textContent = "Saved"; }
        catch(e){ b.textContent = "Failed"; local("err", "save failed: " + e.message); }
        return;
      }
      const r = await post("/api/save", { url, dir: outDir(), scripts: postGen(isVid), chain: pgChain(isVid) });
      b.textContent = r.path ? "Saved" : "Failed";
    };
    c.appendChild(b); cards.appendChild(c);
  });
  const tb = document.getElementById("g-h");
  d.history.slice().reverse().forEach(h=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="mono">${h.ts.replace("T"," ").slice(0,19)}</td>
      <td class="mono">${esc(h.url.replace(API,""))}</td>
      <td><span class="pill ${h.status<300?"p-live":"p-err"}">${h.status}</span></td>
      <td class="mono">${h.requestId||"-"}</td>`;
    tb.appendChild(tr);
  });
}

render(GROUPS[0].items[0][0]);
local("sys","console ready - requests and responses appear here as they happen");
</script>
